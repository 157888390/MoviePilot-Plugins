name: Plugin Release
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package.v2.json'
      - 'package.v3.json'
      # 前端产物与源码也纳入触发：只改插件前端源码 / dist / 构建配置时同样触发，
      # 由下方「构建前端并校验 dist 一致性」步骤把关提交的 dist 是否漂移。
      - 'plugins.v3/**/package.json'
      - 'plugins.v3/**/package-lock.json'
      - 'plugins.v3/**/src/**'
      - 'plugins.v3/**/dist/**'
      - 'plugins.v3/**/vite.config.*'
      # 本仓库为精简第三方仓，首次引入本工作流时不会有 package 文件变更，
      # 故把工作流与门禁脚本自身也纳入触发路径，使其能自举产生首个 Release。
      # 重复触发是安全的：脚本会跳过自上次 tag 以来无变更、且 Release 已存在的插件。
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json

      - name: Check federation plugin CSS
        run: python .github/scripts/check_federation_css.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend plugins and verify dist consistency
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r pkg; do
            dir="$(dirname "$pkg")"
            echo "==> 构建前端：$dir"
            # 用 npm install（而非 npm ci）以便按当前平台解析 esbuild/rollup 原生二进制；
            # 锁文件里只记录了 Windows 平台的 optional 依赖，npm ci 在 Linux 会缺原生库。
            (cd "$dir" && npm install --no-audit --no-fund && npm run build)
            if ! git diff --quiet -- "$dir/dist"; then
              echo "::error:: $dir/dist 与源码重构建产物不一致，请重新构建并提交" >&2
              git diff --stat -- "$dir/dist"
              exit 1
            fi
            found=1
          done < <(find plugins.v3 -maxdepth 3 -name package.json -type f)
          echo "前端构建门禁通过（共 $found 个前端插件）"

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Track processed tags to avoid duplicates across package files.
          : > processed_tags.txt

          process_package() {
            local pkg_file="$1"
            [ -f "$pkg_file" ] || return 0

            echo "Processing $pkg_file"

            # Only entries explicitly marked release=true are packaged.
            mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)"' "$pkg_file")

            if [ "${#entries[@]}" -eq 0 ]; then
              echo "No plugins with release=true in $pkg_file"
              return 0
            fi

            for entry in "${entries[@]}"; do
              plugin_id="${entry%%|*}"
              plugin_version="${entry##*|}"
              plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"

              if ! plugin_dir="$(bash .github/scripts/select_plugin_release_dir.sh "$pkg_file" "$plugin_id_lc")"; then
                echo "Missing plugin directory for $plugin_id in $pkg_file" >&2
                exit 1
              fi

              tag="${plugin_id}_v${plugin_version}"
              asset="${plugin_id_lc}_v${plugin_version}.zip"
              release_notes="$(jq -r --arg plugin_id "$plugin_id" --arg version "v$plugin_version" '.[$plugin_id].history[$version] // empty' "$pkg_file")"
              if [ -z "$release_notes" ]; then
                release_notes="Automated release of $plugin_id $plugin_version"
              fi

              if grep -qxF "$tag" processed_tags.txt; then
                echo "Tag $tag already processed, skip."
                continue
              fi

              changed=1
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                if git diff --quiet "$tag" -- "$plugin_dir"; then
                  changed=0
                fi
              fi

              if [ "$changed" -eq 0 ]; then
                echo "No changes in $plugin_dir since $tag, skip packaging $plugin_id."
                if gh release view "$tag" >/dev/null 2>&1; then
                  gh release edit "$tag" --notes "$release_notes"
                fi
                echo "$tag" >> processed_tags.txt
                continue
              fi

              echo "Packing $plugin_id from $plugin_dir -> $asset"
              rm -f "$asset"
              (cd "$(dirname "$plugin_dir")" && zip -r "$GITHUB_WORKSPACE/$asset" "$(basename "$plugin_dir")" -x "*/__pycache__/*" -x "*.pyc") >/dev/null

              # Re-running a version replaces the release asset for that plugin.
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "Release $tag exists, deleting..."
                gh release delete "$tag" -y
                git push origin :refs/tags/"$tag" || true
              fi

              git tag -d "$tag" >/dev/null 2>&1 || true

              echo "Creating release $tag"
              gh release create "$tag" "$asset" --title "$tag" --notes "$release_notes" --latest --target "$GITHUB_SHA"

              echo "$tag" >> processed_tags.txt
            done
          }

          process_package "package.v2.json"
          process_package "package.json"
          process_package "package.v3.json"
